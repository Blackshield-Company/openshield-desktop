<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0E12" />
    <title>OpenShield Desktop</title>
    %sveltekit.head%
    <script>
      // Pocket: apply insets from the native bridge as soon as the document
      // exists. No-op on desktop, where OpenShieldInsets is undefined.
      (function () {
        function applyOsInsets() {
          var api = window.OpenShieldInsets;
          if (!api) return;
          try {
            var s = document.documentElement.style;
            s.setProperty("--os-inset-top", api.top());
            s.setProperty("--os-inset-right", api.right());
            s.setProperty("--os-inset-bottom", api.bottom());
            s.setProperty("--os-inset-left", api.left());
          } catch (e) {}
        }
        applyOsInsets();
        document.addEventListener("DOMContentLoaded", applyOsInsets);
      })();
    </script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
